# ─────────────────────────────────────────────────────────────
# Configuration rsyslog — réception des logs Resa -> MariaDB
#
# L'application Resa envoie chaque événement sous forme de JSON sur
# une ligne (Monolog SocketHandler) vers ce serveur en UDP/TCP 514.
# On insère le message brut dans la table `events` via ommysql ; les
# identifiants de connexion (${DB_*}) sont injectés au démarrage du
# conteneur par envsubst (voir entrypoint.sh) à partir du .env.
# ─────────────────────────────────────────────────────────────

# --- Modules d'entrée -------------------------------------------------
module(load="imudp")
input(type="imudp" port="514")

module(load="imtcp")
input(type="imtcp" port="514")

# --- Sortie base de données ------------------------------------------
module(load="ommysql")

# Le message reçu EST déjà du JSON : on l'insère tel quel (rawmsg = octets
# exacts reçus). option.sql="on" échappe les quotes pour la requête SQL.
template(name="resaToDB" type="list" option.sql="on") {
    constant(value="INSERT INTO events (raw_json) VALUES ('")
    property(name="rawmsg")
    constant(value="')")
}

# Trace locale (debug) : on garde aussi une copie brute sur disque.
template(name="resaRaw" type="list") {
    property(name="rawmsg")
    constant(value="\n")
}
action(type="omfile" file="/var/log/resa/events.log" template="resaRaw")

# Insertion en base. Quelques tentatives en cas d'indisponibilité brève de
# MariaDB, mais PAS de retry infini : un message rejeté par la base (erreur
# SQL) est abandonné au lieu d'être réinséré en boucle.
action(type="ommysql"
       server="mariadb"
       serverport="3306"
       db="${DB_NAME}"
       uid="${DB_USER}"
       pwd="${DB_PASSWORD}"
       template="resaToDB"
       action.resumeRetryCount="5"
       action.resumeInterval="3")
