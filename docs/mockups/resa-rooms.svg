    <rect x="262" y="108" width="220" height="160" rx="6" class="card"/><rect x="274" y="120" width="196" height="80" rx="4" class="img"/><text x="274" y="222" class="tb">Salle Borée</text><text x="274" y="240" class="tm">4 places · écran</text><rect x="274" y="248" width="90" height="26" rx="4" class="btn"/><text x="286" y="265" fill="#fff" font-size="10">Réserver</text>
    <rect x="500" y="108" width="220" height="160" rx="6" class="card"/><rect x="512" y="120" width="196" height="80" rx="4" class="img"/><text x="512" y="222" class="tb">Salle Cyclope</text><text x="512" y="240" class="tm">20 places · visio</text><rect x="512" y="248" width="90" height="26" rx="4" class="btn"/><text x="524" y="265" fill="#fff" font-size="10">Réserver</text>
  </g>
