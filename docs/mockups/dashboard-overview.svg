<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .frame{fill:#fff;stroke:#9aa3af;stroke-width:1.5}
    .panel{fill:#f4f6f8;stroke:#c5ccd6;stroke-width:1}
    .kpi{fill:#fbfcfd;stroke:#c5ccd6;stroke-width:1}
    .bar{fill:#7c8aa0}
    .bar2{fill:#c2cad6}
    .t{fill:#222;font-size:12px}
    .tb{fill:#111;font-size:13px;font-weight:bold}
    .tm{fill:#555;font-size:10px}
    .badge{fill:#e7ebf0;stroke:#c5ccd6}
  </style>
  <rect x="8" y="8" width="744" height="504" rx="6" class="frame"/>
  <!-- top bar -->
  <rect x="8" y="8" width="744" height="40" rx="6" class="panel"/>
  <text x="24" y="33" class="tb">Resa · Supervision</text>
  <rect x="300" y="16" width="110" height="24" rx="4" class="badge"/><text x="318" y="32" class="t">Vue d'ensemble</text>
  <rect x="418" y="16" width="96" height="24" rx="4" class="badge"/><text x="436" y="32" class="t">Événements</text>
  <circle cx="700" cy="28" r="5" fill="#4a8d5b"/><text x="640" y="32" class="tm">● live</text>
  <!-- KPI row -->
  <g>
    <rect x="24" y="64" width="135" height="78" rx="5" class="kpi"/><text x="36" y="84" class="tm">Événements</text><text x="36" y="110" class="tb">12 480</text><text x="36" y="130" class="tm">24h : 312 ▲8%</text>
    <rect x="171" y="64" width="135" height="78" rx="5" class="kpi"/><text x="183" y="84" class="tm">Trafic humain</text><text x="183" y="110" class="tb">6 120</text><text x="183" y="130" class="tm">96 %</text>
    <rect x="318" y="64" width="135" height="78" rx="5" class="kpi"/><text x="330" y="84" class="tm">🤖 Bots &amp; scans</text><text x="330" y="110" class="tb">260</text><text x="330" y="130" class="tm">4 % · 18 bloqués</text>
    <rect x="465" y="64" width="135" height="78" rx="5" class="kpi"/><text x="477" y="84" class="tm">Sécurité</text><text x="477" y="110" class="tb">47</text><text x="477" y="130" class="tm">à acquitter</text>
    <rect x="612" y="64" width="124" height="78" rx="5" class="kpi"/><text x="624" y="84" class="tm">Santé base</text><text x="624" y="110" class="tb">Actif</text><text x="624" y="130" class="tm">6,2 Mo</text>
  </g>
  <!-- traffic bar -->
  <text x="24" y="172" class="t">Trafic web — humain vs bot</text>
  <rect x="24" y="180" width="712" height="18" rx="4" class="bar2"/>
  <rect x="24" y="180" width="684" height="18" rx="4" class="bar"/>
  <text x="30" y="193" fill="#fff" font-size="10">96 % humain · 4 % bot</text>
  <!-- two panels -->
  <rect x="24" y="214" width="350" height="150" rx="5" class="panel"/>
  <text x="36" y="234" class="t">Activité 24 h (empilée humain/bot)</text>
  <g class="bar">
    <rect x="40" y="320" width="18" height="30"/><rect x="64" y="305" width="18" height="45"/><rect x="88" y="285" width="18" height="65"/>
    <rect x="112" y="270" width="18" height="80"/><rect x="136" y="290" width="18" height="60"/><rect x="160" y="300" width="18" height="50"/>
    <rect x="184" y="280" width="18" height="70"/><rect x="208" y="295" width="18" height="55"/>
  </g>
  <rect x="390" y="214" width="346" height="150" rx="5" class="panel"/>
  <text x="402" y="234" class="t">Top user-agents bots</text>
  <rect x="402" y="248" width="180" height="12" class="bar"/><text x="590" y="258" class="tm">curl/8.0 · 120</text>
  <rect x="402" y="268" width="90" height="12" class="bar"/><text x="500" y="278" class="tm">python-requests · 48</text>
  <rect x="402" y="288" width="50" height="12" class="bar"/><text x="460" y="298" class="tm">nikto · 22</text>
  <!-- bottom panels -->
  <rect x="24" y="380" width="230" height="118" rx="5" class="panel"/><text x="36" y="400" class="t">🔒 Sécurité</text><text x="36" y="422" class="tm">scanner_probe · failed_login</text><text x="36" y="442" class="tm">unauthorized_access</text>
  <rect x="270" y="380" width="220" height="118" rx="5" class="panel"/><text x="282" y="400" class="t">🗄️ Santé base</text><text x="282" y="422" class="tm">flux : Actif · 24/h</text><text x="282" y="442" class="tm">slow query log : 0</text>
  <rect x="506" y="380" width="230" height="118" rx="5" class="panel"/><text x="518" y="400" class="t">Par catégorie / niveau</text><text x="518" y="422" class="tm">http_access ▇▇▇▇▇</text><text x="518" y="442" class="tm">info ▇▇▇▇ · warning ▇▇</text>
</svg>
